# Define Name for the workflw
name: Github Pages Deploy


# event when the workflow will be triggered
on:
    push:
        branches:
            - master

permissions:
  contents: read
  pages: write
  id-token: write

# Define the jobs that need to be run
jobs:
    # define the job name
    deploy_code:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout Souce Code into the VM
              uses: actions/checkout@v6
            
            - name: Setup GitHub Pages Configuration
              uses: actions/configure-pages@v5

            - name: Upload Static Website Artifacts
              uses: actions/upload-pages-artifact@v3
              with:
                path: '.' # Uploads the entire root directory where index.html lives

            - name: Deploy to GitHub Pages Live Site
              id: deployment
              uses: actions/deploy-pages@v4

